trigger: none

pool: default

stages:
  - stage: 
    jobs:
      - job:
        displayName: TerraformInstall|Init|Validate|Plan 
        steps:
        - task: TerraformInstaller@1
          inputs:
            terraformVersion: 'latest'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'serviceconnection'
            backendAzureRmStorageAccountName: 'sanjaystgg'
            backendAzureRmContainerName: 'sanjaycontainer'
            backendAzureRmKey: 'stage.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            environmentServiceNameAzureRM: 'serviceconnection'